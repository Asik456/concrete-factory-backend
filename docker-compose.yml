version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=concrete_factory
      - DB_PORT=5432
      - JWT_SECRET=concrete-factory-jwt-secret-2024
      - NOTIFICATION_URL=http://notification:8081
      - MIGRATIONS_PATH=file://db/migrations
      # Admin account (created automatically on first start)
      - ADMIN_EMAIL_DEFAULT=admin@jbibeton.kz
      - ADMIN_PASSWORD_DEFAULT=Admin123456
      # Email notifications (Gmail App Password required)
      # Get App Password: myaccount.google.com -> Security -> 2FA -> App passwords
      - SMTP_USER=askarzurabekov@gmail.com
      - SMTP_PASSWORD=tvdu zdjd ahkq rlnw
      - ADMIN_EMAIL=askarzurabekov@gmail.com
    restart: on-failure

  notification:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8081:8081"
    restart: on-failure

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: concrete_factory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  postgres_data: